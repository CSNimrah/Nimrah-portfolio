<div class="clock-container">
  <div class="clock">
    <div class="digit-box"><span id="hours">00</span></div>
    <span class="colon">:</span>
    <div class="digit-box"><span id="minutes">00</span></div>
    <span class="colon">:</span>
    <div class="digit-box"><span id="seconds">00</span></div>
  </div>
  <p id="dateDisplay"></p>
</div>

<script>
    //THIS IS FOR TIME
    function updateClock() {
  const date= new Date();

  let hours = String(date.getHours()).padStart(2, "0");  // Get the current hours and convert into text [ beacuse pad start works only with string], pad start (no.of digit u want, 0 ---> ,means dding a leading "0" if needed. So 9 → "09", but 14 stays "14".)
  let minutes = String(date.getMinutes()).padStart(2, "0");
  let seconds = String(date.getSeconds()).padStart(2, "0");

  document.getElementById("hours").textContent = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerHTML = seconds;
// THIS IS FOR DATE

  const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  document.getElementById("dateDisplay").innerHTML = date.toLocaleDateString("en-US", options);
}

updateClock();
setInterval(updateClock, 1000);
</script>
